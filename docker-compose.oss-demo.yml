services:
  postgres:
    env_file: .env.oss-demo
    environment: !reset {}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    volumes:
      - oss_demo_postgres_data:/var/lib/postgresql/data

  redis:
    volumes:
      - oss_demo_redis_data:/data

  backend:
    env_file: .env.oss-demo
    command:
      - sh
      - -c
      - alembic upgrade head && python scripts/bootstrap_open_source_demo.py && uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - oss_demo_data:/app/data
      - oss_demo_uploads:/app/uploads
    ports: !override
      - "127.0.0.1:19100:8000"

  admin:
    ports: !override
      - "127.0.0.1:19180:80"

volumes:
  oss_demo_postgres_data:
  oss_demo_redis_data:
  oss_demo_data:
  oss_demo_uploads:
