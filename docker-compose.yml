services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storefront}
      POSTGRES_USER: ${POSTGRES_USER:-storefront}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storefront_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-storefront} -d ${POSTGRES_DB:-storefront}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: .env
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    ports:
      - "127.0.0.1:19000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    build:
      context: ./frontend-admin
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "127.0.0.1:19080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
